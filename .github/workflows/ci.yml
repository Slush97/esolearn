name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 06:00 UTC

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: check (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.85.0"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-${{ matrix.rust }}
      - run: cargo check --workspace --locked
      - name: clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: rustfmt
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: scry-learn-default
            cmd: cargo test -p scry-learn
          - name: scry-learn-csv-serde
            cmd: cargo test -p scry-learn --features csv,serde
          - name: scry-learn-experimental
            cmd: cargo test -p scry-learn --features experimental
          - name: scry-learn-polars
            cmd: cargo test -p scry-learn --features polars
          - name: scry-learn-mmap
            cmd: cargo test -p scry-learn --features mmap
          - name: scry-llm-no-default
            cmd: cargo test -p scry-llm --no-default-features
          - name: scry-llm-safetensors-tokenizer
            cmd: cargo test -p scry-llm --no-default-features --features safetensors,tokenizer
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.name }}
      - run: ${{ matrix.cmd }}

  miri:
    name: miri
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri
      - run: cargo +nightly miri test -p scry-llm --no-default-features --test miri_safe
