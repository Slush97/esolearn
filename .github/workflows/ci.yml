name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 06:00 UTC

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: check (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.85.0"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-${{ matrix.rust }}
      # `--all-targets` only on stable: pulls in dev-dependencies, and
      # one of them (linfa 0.8.1) uses `is_multiple_of` which only
      # stabilized in Rust 1.87. The lib-only check on 1.85.0 still
      # validates that the workspace itself compiles on MSRV.
      - name: cargo check (lib)
        if: matrix.rust == '1.85.0'
        run: cargo check --workspace --locked
      - name: cargo check (all targets)
        if: matrix.rust == 'stable'
        run: cargo check --workspace --all-targets --locked
      - name: clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: rustfmt
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    # No `needs: check` — tests run in parallel with check. Branch
    # protection still gates merge on both. Saves ~60s per PR.
    strategy:
      fail-fast: false
      matrix:
        include:
          # scry-learn — collapsed from 5 entries to 2. `default`
          # validates the zero-feature build path; `full` exercises every
          # feature combo we actually care about in one cache.
          - name: scry-learn-default
            cmd: cargo nextest run -p scry-learn --locked --profile ci
          - name: scry-learn-full
            cmd: cargo nextest run -p scry-learn --locked --profile ci --features csv,serde,polars,mmap,experimental
          # scry-llm — preserved variants
          - name: scry-llm-no-default
            cmd: cargo nextest run -p scry-llm --locked --profile ci --no-default-features
          - name: scry-llm-safetensors-tokenizer
            cmd: cargo nextest run -p scry-llm --locked --profile ci --no-default-features --features safetensors,tokenizer
          # New coverage — esoc-* family (was completely uncovered)
          - name: esoc-color-scene-gfx-chart
            cmd: cargo nextest run --locked --profile ci -p esoc-color -p esoc-scene -p esoc-gfx -p esoc-chart
          - name: esoc-geo
            cmd: cargo nextest run -p esoc-geo --locked --profile ci --all-features
          # New coverage — vision / cv / diffusion (CPU-only test paths)
          - name: scry-vision
            cmd: cargo nextest run -p scry-vision --locked --profile ci --features safetensors
          - name: scry-cv
            cmd: cargo nextest run -p scry-cv --locked --profile ci --features image-interop,skia-interop
          - name: scry-diffusion
            cmd: cargo nextest run -p scry-diffusion --locked --profile ci --features safetensors,decode
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.name }}
      - run: ${{ matrix.cmd }}

  doc-tests:
    # nextest doesn't run doc-tests; one workspace-wide cargo test --doc
    # picks them up. Cheap because most crates have none.
    #
    # scry-stt is excluded: its `default = ["blas"]` activates scry-llm/blas via
    # workspace feature unification, pulling in cblas-sys → requires libopenblas
    # at link. scry-stt isn't covered by any other CI job either.
    name: doc-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: doc-tests
      - run: cargo test --doc --workspace --exclude scry-stt --locked

  miri:
    name: miri
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri
      - run: cargo +nightly miri test -p scry-llm --no-default-features --test miri_safe

  m9e-artifacts:
    # M9e gate artifacts. The actual perf-regression and golden-image
    # checks need a GPU and SD weights and run from the local pre-push
    # hook (see .githooks/pre-push). This job just validates that the
    # checked-in artifacts those hooks produce are well-formed, so a PR
    # that hand-edits them or commits garbage fails CI.
    name: m9e gate artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: validate bench/history.jsonl
        run: |
          if [ ! -f bench/history.jsonl ]; then
            echo "::error::bench/history.jsonl is missing — seed it with bench_sd --json-out"
            exit 1
          fi
          python3 - <<'PY'
          import json, sys, pathlib
          REQUIRED = [
              "epoch_secs", "sha", "backend", "scheduler",
              "size", "steps", "runs", "cfg", "seed",
              "bf16_matmul", "no_cudnn",
              "wall_ms_median", "step_ms_median",
              "step_ms_min", "step_ms_max", "n_steps_sampled",
          ]
          path = pathlib.Path("bench/history.jsonl")
          n = 0
          for lineno, raw in enumerate(path.read_text().splitlines(), 1):
              line = raw.strip()
              if not line:
                  continue
              try:
                  obj = json.loads(line)
              except json.JSONDecodeError as e:
                  print(f"::error file={path},line={lineno}::malformed JSON: {e}")
                  sys.exit(1)
              missing = [k for k in REQUIRED if k not in obj]
              if missing:
                  print(f"::error file={path},line={lineno}::missing fields {missing}")
                  sys.exit(1)
              n += 1
          if n == 0:
              print(f"::error file={path}::no entries")
              sys.exit(1)
          print(f"bench/history.jsonl: {n} entr{'y' if n==1 else 'ies'} valid")
          PY
      - name: validate golden-hash fixture
        run: |
          FX=crates/scry-diffusion/tests/fixtures/golden_hash.txt
          if [ ! -f "$FX" ]; then
            echo "::error::$FX is missing — seed with GOLDEN_HASH_UPDATE=1 cargo nextest run --test golden_hash"
            exit 1
          fi
          h=$(tr -d '[:space:]' < "$FX")
          if [[ ! "$h" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error file=$FX::not a 64-char lowercase sha256: '$h'"
            exit 1
          fi
          echo "$FX: $h"
