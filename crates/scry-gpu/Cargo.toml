[package]
name = "scry-gpu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Lightweight GPU compute — dispatch shaders without the graphics baggage"
license.workspace = true
repository = "https://github.com/Slush97/esolearn/tree/main/crates/scry-gpu"
documentation = "https://docs.rs/scry-gpu"
keywords = ["gpu", "compute", "vulkan", "gpgpu"]
categories = ["graphics", "science", "concurrency"]
readme = "README.md"

[features]
default = ["vulkan"]
vulkan = ["dep:ash", "dep:gpu-allocator"]
cuda = ["dep:cudarc"]
# Mixed-precision matmul (bf16 in / fp32 accumulate) via cuBLAS GemmEx.
# Note: cudarc gates *both* fp16 and bf16 behind its `f16` feature flag —
# the name is historical; enabling it brings in `half::bf16` too.
bf16 = ["cuda", "cudarc/f16", "dep:half"]
# cuDNN convolution forward path. Requires libcudnn.so on the link path
# (Arch: `pacman -S cudnn`). Picks an algo per shape via cuDNN heuristics
# and caches descriptors + workspace for repeat calls.
cudnn = ["cuda", "cudarc/cudnn"]
bench-wgpu = ["dep:wgpu"]
# metal = []  # future

[dependencies]
# Vulkan backend
ash = { version = "0.38", optional = true, default-features = false, features = ["linked", "debug"] }
gpu-allocator = { version = "0.27", optional = true, default-features = false, features = ["vulkan"] }

# CUDA backend
cudarc = { version = "0.19", optional = true, features = ["cublas", "nvrtc", "cuda-version-from-build-system"] }

# Mixed-precision matmul element types (gated behind the `bf16` feature)
half = { version = "2", optional = true, features = ["bytemuck"] }

# Shader compilation (WGSL → SPIR-V)
naga = { version = "24", features = ["wgsl-in", "spv-out"] }

# Safe reinterpret casts for buffer upload/download
bytemuck = { version = "1", features = ["derive"] }

# Error handling
thiserror = "2"

# Optional: wgpu for backend comparison benchmarks
wgpu = { version = "24", optional = true }

[dev-dependencies]
pollster = "0.4"
rand = "0.9"

[[example]]
name = "bench_wgpu_compare"
required-features = ["bench-wgpu"]

[[example]]
name = "bench_cuda_compare"
required-features = ["cuda", "vulkan"]

[lints.rust]
missing_docs = "warn"
unreachable_pub = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
redundant_pub_crate = "allow"
