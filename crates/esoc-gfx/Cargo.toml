[package]
name = "esoc-gfx"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Renders esoc-scene scene graphs to SVG (and optionally PNG)"
license.workspace = true
repository = "https://github.com/Slush97/esolearn"
documentation = "https://docs.rs/esoc-gfx"
keywords = ["svg", "graphics", "vector", "2d", "rendering"]
categories = ["graphics", "visualization", "rendering"]
readme = "README.md"

[features]
default = []
png = ["dep:resvg", "dep:tiny-skia"]

[dependencies]
esoc-scene = { version = "0.1.0", path = "../esoc-scene" }
esoc-color = { version = "0.1.0", path = "../esoc-color" }
resvg = { version = "0.44", optional = true, default-features = false, features = ["text", "system-fonts"] }
tiny-skia = { version = "0.11", optional = true }

[lints.rust]
missing_docs = "warn"
unreachable_pub = "allow"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_const_for_fn = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
suboptimal_flops = "allow"
too_many_lines = "allow"
needless_pass_by_value = "allow"
many_single_char_names = "allow"
option_if_let_else = "allow"
or_fun_call = "allow"
redundant_closure_for_method_calls = "allow"
