[package]
name = "scry-llm"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Llama inference engine in Rust with CUDA backend"
license.workspace = true

[features]
default = []
cuda = ["dep:cudarc"]
bf16 = ["cuda", "cudarc/f16", "dep:half"]
safetensors = ["dep:safetensors"]
# GGUF (llama.cpp) weight format: header parsing + Q4_K / Q5_K / Q8_0 dequant.
# Pure-Rust; no external deps beyond std + thiserror (already in tree).
gguf = []
tokenizer = ["dep:serde_json"]
blas = ["dep:cblas-sys"]
mkl = ["dep:cblas-sys"]
dnnl = []
scry-gpu = ["dep:scry-gpu", "dep:bytemuck"]
scry-gpu-cuda = ["scry-gpu", "scry-gpu/cuda"]
# bf16 / fp32-accumulate matmul through cuBLAS GemmEx on the scry-gpu path.
# Independent of the existing `bf16` feature (which gates the legacy cudarc
# direct backend's bf16 weight loading); both can coexist.
scry-gpu-bf16 = ["scry-gpu-cuda", "scry-gpu/bf16", "dep:half"]
# Route 2D conv forward through cuDNN (implicit-GEMM / Winograd / FFT, picked
# per shape via the cuDNN heuristic) instead of im2col + cuBLAS. Skips the
# lowering kernel + its HBM round-trip; expected to close the R18-fp32 gap
# to PyTorch.
scry-gpu-cudnn = ["scry-gpu-cuda", "scry-gpu/cudnn"]
auto = ["blas", "scry-gpu"]
quantize = []

[dependencies]
cudarc = { version = "0.19", features = ["cublas", "nvrtc", "cuda-13010"], optional = true }
half = { version = "2", optional = true }
safetensors = { version = "0.4", optional = true }
cblas-sys = { version = "0.1", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
scry-gpu = { path = "../scry-gpu", optional = true }
arrayvec = "0.7"
thiserror = "2"
fastrand = "2"
rayon = "1"
serde_json = { version = "1", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# Unconditional dev-dep so the gguf-golden integration test compiles without
# requiring the `tokenizer` feature.
serde_json = "1"

[[bench]]
name = "llm_ops"
harness = false

[[bench]]
name = "gpu_residency"
harness = false
required-features = ["scry-gpu"]

[[bench]]
name = "gpu_breakdown"
harness = false
required-features = ["scry-gpu"]

[[bench]]
name = "gpu_batched_poc"
harness = false
required-features = ["scry-gpu"]

[[bench]]
name = "threshold_sweep"
harness = false
required-features = ["scry-gpu"]

[[example]]
name = "bench_bf16_matmul"
required-features = ["scry-gpu-bf16"]

[[example]]
name = "run_gguf"
required-features = ["gguf", "tokenizer"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
many_single_char_names = "allow"
must_use_candidate = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
similar_names = "allow"
module_name_repetitions = "allow"
return_self_not_must_use = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"
cast_possible_wrap = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
needless_return = "allow"
redundant_else = "allow"
unnecessary_wraps = "allow"
float_cmp = "allow"
cast_sign_loss = "allow"
