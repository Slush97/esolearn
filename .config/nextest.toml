[profile.default]
# Show failure output immediately AND repeat at the end so it's not lost in the scroll.
failure-output = "immediate-final"
# Don't print PASS for every test — only show non-skipped final status.
status-level = "fail"
final-status-level = "flaky"
# Warn on tests over 30s; kill any single test that hangs past 2 minutes.
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
retries = 2
fail-fast = false
failure-output = "immediate-final"
# 60s × 15 = 15 min hard kill. scry-learn ML golden tests (5-fold CV
# across 4 datasets, California Housing 80/20) routinely run 3–10 min
# on a free GHA runner — the previous 3 min cap was killing them
# mid-run and retrying 3× for nothing. CI runners have their own job
# timeout (6h default) as the real backstop.
slow-timeout = { period = "60s", terminate-after = 15 }
